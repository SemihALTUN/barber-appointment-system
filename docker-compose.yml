# Yerel geliştirme veritabanı: barber_db (uygulama) + barber_test_db (Vitest)
services:
  postgres:
    image: postgres:16-alpine
    container_name: barberbook-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: barber
      POSTGRES_PASSWORD: barber_local_pw
      POSTGRES_DB: barber_db
    ports:
      - "5433:5432" # Makinedeki olası yerel PostgreSQL ile çakışmasın
    volumes:
      - barberbook-pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barber -d barber_db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  barberbook-pgdata:
